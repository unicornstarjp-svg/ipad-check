<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 拡大しないように固定する（母がダブルタップや指で広げて、画面が大きくなったまま戻せなくなるのを防ぐ） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おたすけ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>おたすけ</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#EEF3F6; --card:#FFFFFF; --text:#1B2B3A; --muted:#4B5D6B; --line:#C5D3DC;
  --accent:#C2410C; --accent-text:#FFFFFF; --blue:#0F5F7A; --chip:#E1EAF0;
  --bad:#B42318; --bad-text:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181F; --card:#18232C; --text:#E8EEF2; --muted:#A9B8C3; --line:#2E3E4A;
    --accent:#F0824F; --accent-text:#1B1209; --blue:#6CC3DE; --chip:#22313C;
    --bad:#FF8A7A; --bad-text:#2A0B07;
  }
}
*,*::before,*::after{box-sizing:border-box}
/* 母はスワイプ（スクロール）ができないので、どの画面も1画面に収める。はみ出す分は出さずに「ほか○件」にする */
html,body{height:100%}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}  /* ダブルタップで拡大しない */
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;font-size:22px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
main{height:100%;padding:14px 16px;display:flex;flex-direction:column}
[hidden]{display:none!important}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;line-height:1.3;margin:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
h2{font-size:24px;line-height:1.3;margin:0}
p{margin:0}
.muted{color:var(--muted)}
/* ホーム：上に時計と小さな「画面を新しくする」、真ん中の左に「きょうの予定」と「メモ」、右に「これから1週間の予定」、
   いちばん下に「歌を聴く」「テレビ電話」の大きなボタン（縦向きでも同じ並び） */
.home{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:16px;flex:0 0 auto}
.hello{flex:1;min-width:0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
/* 予定とメモの欄の高さは中身で変えない（変わると、入りきる数の計算がずれる） */
.lcol{display:grid;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);gap:12px;min-height:0;min-width:0}
.cols > *, .lcol > *{min-width:0}  /* 中身の長さで欄が横にはみ出さないように */
.dt{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.date{font-size:26px;font-weight:700}
.clock{font-size:48px;font-weight:700;line-height:1.1}
.status{font-size:18px;color:var(--bad)}
.status:empty{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px;display:flex;flex-direction:column;min-height:0}


.list{flex:1;min-height:0;overflow:hidden}
.sub{font-size:18px;font-weight:700;color:var(--muted);padding-top:6px}
.more{font-size:18px;color:var(--muted);padding-top:4px}
.item{display:flex;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line);white-space:nowrap}
.list > .item:first-child{border-top:0}
.item .when{font-weight:700;color:var(--blue);flex:0 0 auto}
.item .what{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .note{font-weight:400;color:var(--muted);font-size:18px;margin-left:10px}
.item.tap{cursor:pointer}
.item .go{color:var(--muted);font-size:30px;line-height:1;flex:0 0 auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:0 0 auto;height:118px}

.big{display:flex;align-items:center;justify-content:center;text-align:center;min-height:76px;padding:8px 14px;border:3px solid var(--blue);border-radius:18px;
  background:var(--card);color:var(--blue);font:inherit;font-size:28px;font-weight:700;line-height:1.3;text-decoration:none;cursor:pointer;width:100%}
.btns .big{min-height:0;height:100%}
.btns .wide{grid-column:1/-1}
/* 欄の下の「▲ 上へ／下へ ▼」 */
.cpager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;padding-top:6px}
.cpager span{font-size:20px;color:var(--muted)}
/* 欄の見出しの横のボタン */
.chead{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex:0 0 auto;flex-wrap:wrap}  /* 狭い時は、ボタンが見出しの下に回り込む */
.chead h2{flex:1 0 auto;white-space:nowrap}  /* 見出しは縮めない（入らない時はボタンが下の行へ） */
.big.mini{min-height:58px;width:auto;font-size:22px;padding:4px 16px;flex:0 0 auto}
.big.song{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.big.help{background:var(--bad);border-color:var(--bad);color:var(--bad-text)}
.small{min-height:72px;font-size:26px;width:auto;padding:8px 22px}

/* 上の帯：もどる・題・ボタン */
.bar{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.bar h2{flex:1;min-width:0;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 歌手の一覧（1ページ6人。それ以上は「まえ・つぎ」） */
.pagegrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px}
@media (orientation:portrait){ .pagegrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))} }
.pagegrid .big{height:100%;min-height:0;font-size:32px}
.pagegrid .muted{grid-column:1/-1;align-self:center;text-align:center}
/* 「ふつうの歌／カラオケ」の切り替え。選んでいる方を塗りつぶす */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:0 0 auto}
.modes .big{width:100%}
.modes .big.on{background:var(--blue);color:var(--card)}
.pager{justify-content:center}
.pager span{font-size:22px;color:var(--muted);min-width:5em;text-align:center}

/* 歌：YouTubeのプレーヤーを最初から大きく出す。真ん中の▶を1回さわれば再生（iPadはページのボタンからの自動再生を許さないため） */
.songname{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.songname .pos{color:var(--muted);font-weight:400;margin-left:12px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.stage .muted{font-size:26px}
/* 16:9 のまま、入る大きさいっぱいに（幅で決まるか高さで決まるかは画面の向きしだい） */
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
@container (min-width:0px){ .player{width:min(100cqw, calc(100cqh * 16 / 9))} }
.player iframe{width:100%;height:100%;border:0;display:block}
.big:disabled{opacity:.35;cursor:default}
/* 大きくする：YouTubeの全画面は閉じるボタンが小さくて母には戻せないので、おたすけの中で動画だけを画面いっぱいにする。
   上の帯には「小さくする」と「つぎの歌」だけを残す */
#btn-small{display:none}
#v-play.bigmode #btn-small{display:flex}
#v-play.bigmode #btn-play-back, #v-play.bigmode #btn-prev, #v-play.bigmode #btn-big,
#v-play.bigmode .songname, #v-play.bigmode .adnote, #v-play.bigmode .card.songs{display:none}
#v-play.bigmode .stage2{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#v-play.bigmode .pcol .stage{flex:1;height:auto}
#v-play.bigmode{gap:8px}
@media (orientation:portrait){ #v-play .bar h2{visibility:hidden} }  /* 縦向きは帯が狭いので歌手名を出さない（曲名はすぐ下に出る） */
/* 左にプレーヤー、右に曲の一覧（縦向きは上下）。一覧はスワイプの代わりに「上へ・下へ」 */
.stage2{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px}
.pcol{display:flex;flex-direction:column;gap:8px;min-height:0}
.adnote{font-size:20px;font-weight:700;color:var(--text);flex:0 0 auto;line-height:1.4}
@media (orientation:portrait){
  .stage2{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .pcol .stage{flex:none;height:calc((100vw - 32px) * 9 / 16)}
}
.card.songs{padding:10px}
.sitem{display:flex;gap:12px;align-items:center;height:84px;padding:4px 6px;border-radius:12px;cursor:pointer}
.sitem + .sitem{margin-top:6px}
.sitem img{width:120px;height:68px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--chip)}
.sitem .t{font-size:20px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.sitem.on{background:var(--chip);box-shadow:inset 0 0 0 3px var(--accent)}
.lpager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex:0 0 auto;padding-top:8px}
.lpager .big{min-height:64px;font-size:22px;padding:6px 14px}
.lpager span{font-size:20px;color:var(--muted)}

/* 設定（家族用）だけは、はみ出したらスクロールしてよい */
#v-set{overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:center}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:20px}
input[type=text],input[type=url],input[type=password]{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.set-msg{margin-top:12px;font-size:20px}

.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.dlg .box{background:var(--card);border-radius:20px;padding:24px;max-width:600px;width:100%;max-height:100%;overflow:hidden}
.dlg .box p{font-size:28px;font-weight:700;white-space:pre-line}
.dlg .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.dlg .grid .big{min-height:84px}
</style>
</head>
<body>
<main>

<section id="v-home" class="view home">
  <div class="top">
    <div class="hello">
      <h1 id="greet">こんにちは</h1>
      <span class="date" id="date"></span><span class="clock" id="clock"></span>
    </div>
    <button type="button" class="big mini" id="btn-reload">↻ 画面を新しくする</button>
  </div>
  <div class="status" id="status" role="status"></div>
  <div class="cols">
    <!-- 左：きょうの予定とメモ。ボタンは、それぞれの欄の見出しの横に置く（どの欄の操作か分かるように） -->
    <div class="lcol">
      <div class="card fill">
        <div class="chead">
          <h2>きょうの予定</h2>
          <button type="button" class="big mini" id="btn-read">🔊 読む</button>
          <button type="button" class="big mini" id="btn-add-sched">🎤 予定を話す</button>
        </div>
        <div class="list" id="sched"></div>
        <div class="cpager" id="pg-sched" hidden><button type="button" class="big mini up">▲ 上へ</button><span></span><button type="button" class="big mini down">下へ ▼</button></div>
      </div>
      <div class="card memo">
        <div class="chead">
          <h2>メモ</h2>
          <button type="button" class="big mini" id="btn-memo">🎤 メモを話す</button>
        </div>
        <div class="list" id="memos"></div>
        <div class="cpager" id="pg-memos" hidden><button type="button" class="big mini up">▲ 上へ</button><span></span><button type="button" class="big mini down">下へ ▼</button></div>
      </div>
    </div>
    <!-- 右：これから1週間の予定 -->
    <div class="card week">
      <div class="chead">
        <h2>これからの予定</h2>
        <button type="button" class="big mini" id="btn-regular">🔁 いつもの予定</button>
      </div>
      <div class="list" id="sched2"></div>
        <div class="cpager" id="pg-sched2" hidden><button type="button" class="big mini up">▲ 上へ</button><span></span><button type="button" class="big mini down">下へ ▼</button></div>
    </div>
  </div>
  <!-- TVer・困った・Amazonプライム・みてねは外した（2026-10-04） -->
  <div class="btns">
    <button type="button" class="big song" id="btn-songs">歌を聴く</button>
    <button type="button" class="big song" id="btn-call">テレビ電話</button>
  </div>
</section>

<section id="v-songs" class="view" hidden>
  <div class="bar">
    <button type="button" class="big small" data-back="home">もどる</button>
    <h2>だれの歌にしますか</h2>
    <button type="button" class="big small" id="btn-add-singer">歌手を足す（話す）</button>
  </div>
  <div class="modes">
    <button type="button" class="big small on" id="mode-song" aria-pressed="true">♪ ふつうの歌</button>
    <button type="button" class="big small" id="mode-kara" aria-pressed="false">🎤 カラオケ</button>
  </div>
  <div class="pagegrid" id="singers"></div>
  <div class="bar pager" id="pager" hidden>
    <button type="button" class="big small" id="pg-prev">◀ まえ</button>
    <span id="pg-info"></span>
    <button type="button" class="big small" id="pg-next">つぎ ▶</button>
  </div>
</section>

<section id="v-tv" class="view" hidden>
  <div class="bar">
    <button type="button" class="big small" data-back="home">もどる</button>
    <h2>どの番組を見ますか</h2>
    <a class="big small ext" href="https://tver.jp/" data-name="TVer">TVerを開く</a>
  </div>
  <div class="pagegrid" id="programs"></div>
  <div class="bar pager" id="tv-pager" hidden>
    <button type="button" class="big small" id="tv-prev">◀ まえ</button>
    <span id="tv-info"></span>
    <button type="button" class="big small" id="tv-next">つぎ ▶</button>
  </div>
</section>

<section id="v-call" class="view" hidden>
  <div class="bar">
    <button type="button" class="big small" data-back="home">もどる</button>
    <h2>だれにかけますか</h2>
  </div>
  <div class="pagegrid" id="contacts"></div>
  <div class="bar pager" id="call-pager" hidden>
    <button type="button" class="big small" id="call-prev">◀ まえ</button>
    <span id="call-info"></span>
    <button type="button" class="big small" id="call-next">つぎ ▶</button>
  </div>
</section>

<!-- いつもの予定（くりかえし）の一覧。さわると変える・消す -->
<section id="v-regular" class="view" hidden>
  <div class="bar">
    <button type="button" class="big small" data-back="home">もどる</button>
    <h2>いつもの予定（くりかえし）</h2>
    <button type="button" class="big small" id="btn-add-regular">🎤 いつもの予定を話す</button>
  </div>
  <div class="card fill" style="flex:1">
    <div class="list" id="regs"></div>
    <div class="cpager" id="pg-regs" hidden><button type="button" class="big mini up">▲ 上へ</button><span></span><button type="button" class="big mini down">下へ ▼</button></div>
  </div>
</section>

<section id="v-play" class="view" hidden>
  <div class="bar">
    <button type="button" class="big small" id="btn-play-back">もどる</button>
    <button type="button" class="big small" id="btn-small">◀ 小さくする</button>
    <h2 id="play-title"></h2>
    <button type="button" class="big small" id="btn-prev">◀ まえの歌</button>
    <button type="button" class="big small song" id="btn-next">つぎの歌 ▶</button>
    <button type="button" class="big small" id="btn-big">⛶ 大きくする</button>
  </div>
  <div class="stage2">
    <div class="pcol">
      <div class="songname" id="song-name"></div>
      <div class="stage"><div class="player" id="player"></div></div>
      <p class="adnote">歌が終わると、つぎの歌に進みます（さいごまで行くと、はじめから）。<br>はじめにコマーシャルが出ることがあります。右下の「スキップ」をさわると、歌になります。</p>
    </div>
    <div class="card songs">
      <div class="list" id="song-list"></div>
      <div class="lpager">
        <button type="button" class="big small" id="sl-prev">▲ 上へ</button>
        <span id="sl-info"></span>
        <button type="button" class="big small" id="sl-next">下へ ▼</button>
      </div>
    </div>
  </div>
</section>

<section id="v-set" class="view" hidden>
  <h2>設定（家族用）</h2>
  <p class="muted">スプレッドシートの窓口のURLと、あいことばを入れます。このiPadの中だけに保存されます。</p>
  <label for="set-url">窓口のURL</label>
  <input type="url" id="set-url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="set-token">あいことば</label>
  <input type="password" id="set-token" autocapitalize="off" autocorrect="off">
  <div class="row">
    <button type="button" class="big small" id="set-save" style="width:auto">保存してためす</button>
    <button type="button" class="big small" data-back="home" style="width:auto">もどる</button>
  </div>
  <div class="set-msg" id="set-msg" role="status"></div>
</section>

</main>

<div class="dlg" id="dlg" hidden>
  <div class="box">
    <p id="dlg-text"></p>
    <div class="grid" id="dlg-btns"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY_CFG = 'otasuke.cfg', KEY_CACHE = 'otasuke.cache';
  // 公開するたびに version.txt と同じ値に上げる。違っていたら、iPad が自分で読み込み直す
  var VERSION = '2026-10-04x';
  var ENDPOINT_RE = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
  var WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  var cfg = readJSON(KEY_CFG) || {};
  var data = {};

  function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function configured() { return !!(cfg.u && cfg.t && ENDPOINT_RE.test(cfg.u)); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  /* ---------- 画面の切り替え ---------- */
  var views = ['home', 'songs', 'tv', 'call', 'regular', 'play', 'set'];
  function show(name) {
    views.forEach(function (v) { $('v-' + v).hidden = (v !== name); });
    if (name !== 'play') stopPlayer();
    if (name === 'home') { renderMemos(); renderSchedule(); }
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-back')); });
  });

  /* ---------- あいさつ・日付・時計 ---------- */
  function tick() {
    var d = new Date(), h = d.getHours();
    $('greet').textContent = h < 5 ? 'こんばんは' : h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'こんばんは';
    $('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WEEK[d.getDay()] + '）';
    var m = d.getMinutes();
    $('clock').textContent = (h < 12 ? '午前 ' : '午後 ') + (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m;
  }

  /* ---------- 窓口との通信 ---------- */
  function api(body) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    var url = cfg.u, opt = ctl ? { signal: ctl.signal } : {};
    if (body) {
      body.token = cfg.t;
      opt.method = 'POST';
      opt.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opt.body = JSON.stringify(body);
    } else {
      url += '?token=' + encodeURIComponent(cfg.t);
    }
    return fetch(url, opt).then(function (r) { clearTimeout(timer); return r.json(); },
                                function (e) { clearTimeout(timer); throw e; });
  }
  function setStatus(t) { $('status').textContent = t; }

  function load() {
    if (!configured()) { openSettings(''); return Promise.resolve(); }
    return api().then(function (d) {
      if (d.error) throw new Error(d.error);
      data = d;
      writeJSON(KEY_CACHE, { at: Date.now(), data: d });
      setStatus('');
      renderAll();
    }).catch(function (e) {
      var c = readJSON(KEY_CACHE);
      data = (c && c.data) || {};
      renderAll();
      if (e.message === 'unauthorized') setStatus('あいことばが合っていません。（家族の人は設定をなおしてください）');
      else if (c && c.data) setStatus('いま、ネットにつながっていません。前に見たときの予定を出しています。');
      else setStatus('予定をよみこめませんでした。');
    });
  }

  /* ---------- 予定 ---------- */
  function parseDate(s) {
    s = (s || '').trim();
    var m, y, mo, d;
    if ((m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/(\d{1,2})\D+(\d{1,2})/))) { y = new Date().getFullYear(); mo = +m[1]; d = +m[2]; }
    else return null;
    var dt = new Date(y, mo - 1, d);
    return dt.getMonth() === mo - 1 ? dt : null;
  }
  /* ---------- くりかえしの予定 ----------
     日付の欄が「毎日」「毎週火」「毎週月木」「毎月15日」「毎月第2水」「毎月最終土」の時。くりかえしでなければ null */
  function recurRule(s) {
    s = String(s || '').trim().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    var m;
    if (/^毎日/.test(s)) return { type: 'daily' };
    if ((m = s.match(/^毎週\s*(.+)$/))) {
      var ds = [];
      WEEK.forEach(function (w, i) { if (m[1].indexOf(w) >= 0) ds.push(i); });
      return ds.length ? { type: 'weekly', days: ds } : null;
    }
    if ((m = s.match(/^毎月\s*(\d{1,2})\s*日/))) return { type: 'monthly', day: +m[1] };
    if ((m = s.match(/^毎月\s*第\s*([1-5])\s*([月火水木金土日])/))) return { type: 'nth', n: +m[1], wd: WEEK.indexOf(m[2]) };
    if ((m = s.match(/^毎月\s*最終\s*([月火水木金土日])/))) return { type: 'nth', n: -1, wd: WEEK.indexOf(m[1]) };
    return null;
  }
  // その日がくりかえしの日にあたるか
  function occursOn(rule, dt) {
    if (rule.type === 'daily') return true;
    if (rule.type === 'weekly') return rule.days.indexOf(dt.getDay()) >= 0;
    if (rule.type === 'monthly') return dt.getDate() === rule.day;
    if (dt.getDay() !== rule.wd) return false;
    if (rule.n === -1) return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 7).getMonth() !== dt.getMonth();  // 最後の○曜日
    return Math.ceil(dt.getDate() / 7) === rule.n;  // 第○○曜日
  }
  // 「毎週 火曜日」「毎月15日」「毎月 第2 水曜日」のような言葉
  function recurText(rule) {
    if (rule.type === 'daily') return '毎日';
    if (rule.type === 'weekly') return '毎週 ' + rule.days.map(function (i) { return WEEK[i] + '曜日'; }).join('と');
    if (rule.type === 'monthly') return '毎月' + rule.day + '日';
    return '毎月 ' + (rule.n === -1 ? '最後の' : '第' + rule.n + ' ') + WEEK[rule.wd] + '曜日';
  }
  function spokenTime(t) {
    var m = (t || '').match(/(\d{1,2})\D+(\d{2})/);
    if (!m) return t || '';
    var h = +m[1], ampm = h === 12 ? 'お昼の' : h > 12 ? '午後' : '午前';
    return ampm + (h > 12 ? h - 12 : h) + '時' + (m[2] === '00' ? '' : (+m[2]) + '分');
  }
  // todayItems：きょうの予定（くりかえしの予定のうち、きょうにあたるものも入る）
  // upcoming：あした以降の予定を日ごとにまとめたもの（日付の予定は日数の上限なし）。
  //   くりかえしの予定は、毎週は7日先まで、毎月は次の1回だけを混ぜる（🔁を付ける）。毎日はきょうだけ
  // 中身は { r: 表の1行, rec: くりかえしか }
  var todayItems = [], upcoming = [], regulars = [];
  function renderSchedule() {
    var rows = data['予定'] || [], now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var byDay = {};
    todayItems = []; upcoming = []; regulars = [];
    function addDay(diff, dt, x) {
      if (!byDay[diff]) { byDay[diff] = { dt: dt, diff: diff, items: [] }; upcoming.push(byDay[diff]); }
      byDay[diff].items.push(x);
    }
    rows.forEach(function (r) {
      if (!(r['内容'] || '').trim()) return;
      var rule = recurRule(r['日付']);
      if (rule) {
        regulars.push({ r: r, rule: rule });
        if (occursOn(rule, today)) todayItems.push({ r: r, rec: true });
        if (rule.type === 'daily') return;
        var limit = rule.type === 'weekly' ? 7 : 62;
        for (var d = 1; d <= limit; d++) {
          var dt2 = new Date(today.getFullYear(), today.getMonth(), today.getDate() + d);
          if (!occursOn(rule, dt2)) continue;
          addDay(d, dt2, { r: r, rec: true });
          if (rule.type !== 'weekly') break;  // 毎月の予定は次の1回だけ
        }
        return;
      }
      var dt = parseDate(r['日付']);
      if (!dt) return;
      var diff = Math.round((dt - today) / 864e5);
      if (diff === 0) todayItems.push({ r: r, rec: false });
      else if (diff > 0) addDay(diff, dt, { r: r, rec: false });
    });
    // 時刻は「9:00」と「15:00」を文字で比べると順番が狂うので、分に直して比べる（時刻なしは先頭）
    var mins = function (s) { var m = String(s || '').match(/(\d{1,2})\D+(\d{2})/); return m ? +m[1] * 60 + +m[2] : -1; };
    var byTime = function (a, b) { return mins(a.r['時刻']) - mins(b.r['時刻']); };
    todayItems.sort(byTime);
    upcoming.sort(function (a, b) { return a.diff - b.diff; });
    upcoming.forEach(function (g) { g.items.sort(byTime); });

    function item(x) {
      var r = x.r;
      return function () {
        var what = el('div', 'what', (x.rec ? '🔁 ' : '') + r['内容']);
        if ((r['備考'] || '').trim()) what.appendChild(el('span', 'note', r['備考']));
        return tapItem(r['時刻'] || '', what, function () { scheduleMenu(r); });
      };
    }
    function note(text) { return function () { return el('p', 'muted', text); }; }

    // きょうの欄
    var rows1 = todayItems.map(function (x) { return { kind: 'item', make: item(x), group: -1 }; });
    if (!rows1.length) rows1.push({ kind: 'note', make: note('きょうの予定は、ありません。'), group: -1 });
    pagedList('sched', rows1);

    // これからの欄：日ごとに見出し（あした 10/5（月））と予定。年が変わる時は年も出す
    var rows2 = [];
    upcoming.forEach(function (g) {
      var label = (g.diff === 1 ? 'あした　' : '') + (g.dt.getFullYear() !== today.getFullYear() ? g.dt.getFullYear() + '/' : '') +
        (g.dt.getMonth() + 1) + '/' + g.dt.getDate() + '（' + WEEK[g.dt.getDay()] + '）';
      var head = rows2.length;
      rows2.push({ kind: 'sub', make: function () { return el('div', 'sub', label); }, group: -1 });
      g.items.forEach(function (x) { rows2.push({ kind: 'item', make: item(x), group: head }); });
    });
    if (!rows2.length) rows2.push({ kind: 'note', make: note('これからの予定は、ありません。'), group: -1 });
    pagedList('sched2', rows2);
  }

  // いつもの予定（くりかえし）の一覧：毎日→毎週→毎月の順。さわると変える・消す
  function renderRegular() {
    var order = { daily: 0, weekly: 1, monthly: 2, nth: 3 };
    var list = regulars.slice().sort(function (a, b) { return order[a.rule.type] - order[b.rule.type]; });
    var rows = list.map(function (x) {
      return { kind: 'item', group: -1, make: function () {
        var what = el('div', 'what', x.r['内容']);
        if ((x.r['備考'] || '').trim()) what.appendChild(el('span', 'note', x.r['備考']));
        return tapItem(recurText(x.rule) + (x.r['時刻'] ? ' ' + x.r['時刻'] : ''), what, function () { scheduleMenu(x.r); });
      } };
    });
    if (!rows.length) rows.push({ kind: 'note', group: -1, make: function () {
      return el('p', 'muted', 'いつもの予定は、まだありません。「いつもの予定を話す」で、「毎週火曜の10時はオレンジルーム」のように話してください。');
    } });
    pagedList('regs', rows);
  }
  $('btn-regular').addEventListener('click', function () { show('regular'); renderRegular(); });
  $('btn-add-regular').addEventListener('click', function () { addByVoice('schedule'); });

  /* ---------- 入りきらない一覧は「▲ 上へ／下へ ▼」でページを送る（母はスワイプできないため） ---------- */
  // rows：{ kind: 'sub'（日付の見出し）| 'item' | 'note', make: 要素を作る関数, group: 見出しの番号（ページの頭に見出しを付け直すため） }
  var pagers = {};
  function pagedList(id, rows) {
    var box = $(id), pg = $('pg-' + id);
    var st = pagers[id] || (pagers[id] = { page: 0, starts: [0], rows: [] });
    st.rows = rows;
    if (!pg.getAttribute('data-bound')) {
      pg.setAttribute('data-bound', '1');
      pg.querySelector('.up').addEventListener('click', function () { if (st.page > 0) { st.page--; showPage(id); } });
      pg.querySelector('.down').addEventListener('click', function () { if (st.page < st.starts.length - 1) { st.page++; showPage(id); } });
    }
    function build(from, to) {
      clear(box);
      if (from < to && rows[from].kind === 'item' && rows[from].group >= 0) box.appendChild(rows[rows[from].group].make());
      for (var k = from; k < to; k++) box.appendChild(rows[k].make());
    }
    pg.hidden = true;
    build(0, rows.length);
    if (!box.clientHeight || box.scrollHeight <= box.clientHeight + 1) { st.starts = [0]; st.page = 0; return; }
    // 入りきらない：ページ送りのボタンを出して、1ページに入る行を前から順に数える
    pg.hidden = false;
    var starts = [], i = 0;
    while (i < rows.length) {
      var s = i;
      starts.push(s);
      clear(box);
      if (rows[i].kind === 'item' && rows[i].group >= 0) box.appendChild(rows[rows[i].group].make());
      while (i < rows.length) {
        box.appendChild(rows[i].make());
        if (box.scrollHeight > box.clientHeight + 1 && i > s) break;
        i++;
      }
      if (i < rows.length && i - 1 > s && rows[i - 1].kind === 'sub') i--;  // 見出しだけをページの最後に残さない
    }
    st.starts = starts;
    if (st.page >= starts.length) st.page = starts.length - 1;
    showPage(id);
  }
  function showPage(id) {
    var st = pagers[id], box = $(id), pg = $('pg-' + id), rows = st.rows;
    var from = st.starts[st.page], to = st.starts[st.page + 1] || rows.length;
    clear(box);
    if (from < to && rows[from].kind === 'item' && rows[from].group >= 0) box.appendChild(rows[rows[from].group].make());
    for (var k = from; k < to; k++) box.appendChild(rows[k].make());
    pg.querySelector('span').textContent = (st.page + 1) + ' / ' + st.starts.length;
    pg.querySelector('.up').disabled = st.page === 0;
    pg.querySelector('.down').disabled = st.page >= st.starts.length - 1;
  }

  function tapItem(when, what, onTap) {
    var row = el('div', 'item tap');
    row.appendChild(el('div', 'when', when));
    row.appendChild(what);
    row.appendChild(el('div', 'go', '›'));
    row.setAttribute('role', 'button'); row.tabIndex = 0;
    row.addEventListener('click', onTap);
    return row;
  }
  // 箱からはみ出す行を後ろから外して、外した数を「ほか○件（家族がスプレッドシートで見られます）」で出す
  function fitList(box) {
    if (!box.clientHeight) return;  // 見えていない時は数えない（ホームに戻った時に並べ直す）
    if (box.scrollHeight <= box.clientHeight + 1) return;
    var hidden = 0, more = el('div', 'more');
    box.appendChild(more);
    // 後ろから1つずつ外す。日付の見出し（.sub）も一緒に外す（見出しだけ残ると、場所を取って予定が出なくなるため）
    while (box.scrollHeight > box.clientHeight + 1) {
      var last = more.previousElementSibling;
      if (!last || !(last.classList.contains('item') || last.classList.contains('sub'))) break;
      if (last.classList.contains('item')) hidden++;
      box.removeChild(last);
      more.textContent = 'ほか ' + hidden + '件';
    }
    // 予定が1つも続かない見出しが最後に残っていたら外す
    var tail = more.previousElementSibling;
    if (tail && tail.classList.contains('sub')) box.removeChild(tail);
  }

  /* ---------- 読み上げ ---------- */
  // done は読み終わった時に1回だけ呼ぶ（onend が来ない時のために、文の長さから見積もった時間でも呼ぶ）
  function speak(text, done) {
    var called = false;
    var finish = function () { if (!called && done) { called = true; done(); } };
    if (!('speechSynthesis' in window)) { finish(); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 0.9;
      var v = window.speechSynthesis.getVoices().filter(function (x) { return /^ja/i.test(x.lang); });
      if (v.length) u.voice = v[0];
      u.onend = function () { setTimeout(finish, 250); };
      u.onerror = finish;
      window.speechSynthesis.speak(u);
      if (done) setTimeout(finish, 1500 + text.length * 250);
    } catch (e) { finish(); }
  }
  // きょうの予定に続けて、7日先までの予定（予定のある日だけ）を読む。それより先は長くなるので読まない
  $('btn-read').addEventListener('click', function () {
    function list(items) {
      return items.map(function (x) { return (x.r['時刻'] ? spokenTime(x.r['時刻']) + 'に、' : '') + x.r['内容']; }).join('。 ');
    }
    var text = todayItems.length ? 'きょうの予定は、' + list(todayItems) + '、です。' : 'きょうの予定は、ありません。';
    var week = upcoming.filter(function (g) { return g.diff <= 7; });
    if (!week.length) text += ' これから1週間の予定は、ありません。';
    week.forEach(function (g) {
      var who = g.diff === 1 ? 'あした' : (g.dt.getMonth() + 1) + '月' + g.dt.getDate() + '日、' + WEEK[g.dt.getDay()] + '曜日';
      text += ' ' + who + 'は、' + list(g.items) + '。';
    });
    speak(text);
  });

  /* ---------- 歌手とYouTube ---------- */
  function videoId(s) {
    s = (s || '').trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    var m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  // 歌手は1ページ6人（縦向きも6人）。それ以上は「まえ・つぎ」で切り替える
  var PAGE = 6, page = 0;
  function renderSingers() {
    var box = $('singers'); clear(box);
    var rows = (data['歌手'] || []).filter(function (r) { return (r['名前'] || '').trim(); });
    var pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if (page >= pages) page = pages - 1;
    $('pager').hidden = pages <= 1;
    $('pg-info').textContent = (page + 1) + ' / ' + pages;
    $('pg-prev').disabled = page === 0;
    $('pg-next').disabled = page === pages - 1;
    if (!rows.length) { box.appendChild(el('p', 'muted', '歌手は、まだ登録されていません。「歌手を足す」で話してください。')); return; }
    rows.slice(page * PAGE, page * PAGE + PAGE).forEach(function (r) {
      var b = el('button', 'big', r['名前']);
      b.type = 'button';
      b.addEventListener('click', function () { openSinger(r); });
      box.appendChild(b);
    });
  }
  $('pg-prev').addEventListener('click', function () { if (page > 0) { page--; renderSingers(); } });
  $('pg-next').addEventListener('click', function () { page++; renderSingers(); });

  // 曲の一覧は、まず表の「動画1〜」の列。そのあと窓口に聞いて、YouTube検索の結果（最大20曲）に入れ替える
  var current = { name: '', items: [], idx: -1 };
  var videoLists = {};  // 歌手ごとに、このページを開いている間だけ覚えておく
  // YouTube のプレーヤーの仕組み（IFrame Player API）で、曲の終わりを知って次の曲へ進む。最後の曲のあとは最初に戻る。
  // 同じプレーヤーのまま曲を替えるので、iPadでも最初に1回▶をさわれば、あとは続けて流れる見込み。
  // 仕組みが読めない時（ネットが細い等）は、ふつうの埋め込みにする（その時は自動で次へは進まない）
  var yt = null, ytOk = false, ytLoading = null, errors = 0;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (ytLoading) return ytLoading;
    ytLoading = new Promise(function (resolve, reject) {
      window.onYouTubeIframeAPIReady = resolve;
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = reject;
      document.head.appendChild(s);
      setTimeout(reject, 10000);
    });
    ytLoading.catch(function () { ytLoading = null; });  // 失敗したら、次の曲の時にもう一度ためす
    return ytLoading;
  }
  function stopPlayer() {
    $('v-play').classList.remove('bigmode');  // 歌の画面を出るときは、大きくしていたのも戻す
    if (yt) { try { yt.destroy(); } catch (e) {} }
    yt = null; ytOk = false;
    clear($('player'));  // プレーヤーを外すと音も止まる
    current.idx = -1;
  }
  function plainPlayer(id, autoplay) {
    var p = $('player'); clear(p);
    var f = el('iframe');
    f.src = 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0' + (autoplay ? '&autoplay=1' : '');
    f.title = current.name + 'の歌';
    f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    p.appendChild(f);
  }
  function cue(i, autoplay) {
    var it = current.items[i];
    if (!it) return;
    current.idx = i;
    listPage = Math.floor(i / perPage());  // 流している曲が一覧に見えるページへ
    renderSongBar();
    var name = current.name;
    loadYT().then(function () {
      if (current.name !== name || current.idx !== i) return;  // 待っている間に、別の曲・別の画面になった
      if (yt && ytOk) { if (autoplay) yt.loadVideoById(it.id); else yt.cueVideoById(it.id); return; }
      if (yt) { try { yt.destroy(); } catch (e) {} }
      var p = $('player'); clear(p);
      var holder = el('div'); p.appendChild(holder);
      ytOk = false;
      yt = new YT.Player(holder, {
        width: '100%', height: '100%', videoId: it.id,
        playerVars: { playsinline: 1, rel: 0, autoplay: autoplay ? 1 : 0 },
        events: {
          onReady: function () { ytOk = true; },
          onStateChange: function (e) {
            if (e.data === 1) errors = 0;      // 再生が始まった
            if (e.data === 0) nextSong(true);  // 曲が終わった
          },
          // 「ここでは再生できません」の曲は飛ばす（全部だめなら止まる）
          onError: function () { errors++; if (errors < current.items.length) nextSong(true); }
        }
      });
    }, function () {
      if (current.name !== name || current.idx !== i) return;
      plainPlayer(it.id, autoplay);
    });
  }
  function nextSong(autoplay) {
    var n = current.items.length;
    if (n) cue((current.idx + 1) % n, autoplay);
  }

  // 一覧は1行の高さを決めてあるので、入る行数＝1ページの曲数
  var listPage = 0, ROW = 90;
  function perPage() { return Math.max(1, Math.floor(($('song-list').clientHeight + 6) / ROW)); }
  function renderSongList() {
    var box = $('song-list'); clear(box);
    if (!box.clientHeight) return;
    var n = current.items.length, pp = perPage(), pages = Math.max(1, Math.ceil(n / pp));
    if (listPage >= pages) listPage = pages - 1;
    if (listPage < 0) listPage = 0;
    current.items.slice(listPage * pp, listPage * pp + pp).forEach(function (it, k) {
      var i = listPage * pp + k;
      var row = el('div', 'sitem' + (i === current.idx ? ' on' : ''));
      row.setAttribute('role', 'button'); row.tabIndex = 0;
      var img = el('img'); img.alt = ''; img.src = 'https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg';
      row.appendChild(img);
      row.appendChild(el('div', 't', it.title || (i + 1) + '曲め'));
      row.addEventListener('click', function () { cue(i, true); });
      box.appendChild(row);
    });
    $('sl-info').textContent = n ? (listPage + 1) + ' / ' + pages : '';
    $('sl-prev').disabled = listPage === 0;
    $('sl-next').disabled = listPage >= pages - 1;
  }
  $('sl-prev').addEventListener('click', function () { listPage--; renderSongList(); });
  $('sl-next').addEventListener('click', function () { listPage++; renderSongList(); });
  function renderSongBar() {
    var n = current.items.length, box = $('song-name'); clear(box);
    if (current.idx >= 0) {
      box.appendChild(document.createTextNode(current.items[current.idx].title || ''));
      box.appendChild(el('span', 'pos', (current.idx + 1) + ' / ' + n + '曲'));
    }
    $('btn-prev').disabled = current.idx <= 0;
    $('btn-next').disabled = current.idx < 0 || n < 2;  // 最後の曲の「つぎ」は、最初の曲に戻る
    renderSongList();
  }
  /* ---------- 別のアプリが開くボタン（TVer・Amazonプライム・みてね） ---------- */
  // 開いたあと、おたすけへの戻り方が分からなくならないように、開く前に画面と声で案内する
  // newWin：アプリに切り替わらないもの（Amazonプライム・みてね）は Safari で開く。
  // ホーム画面のおたすけの中でそのまま開くと、おたすけ自体がそのページに置き換わって戻れなくなるため
  function openApp(url, name, newWin) {

      { label: 'やめる', fn: function () { try { window.speechSynthesis.cancel(); } catch (e) {} closeDialog(); } }

  document.addEventListener('click', function (e) {

  /* ---------- テレビ電話（FaceTime） ---------- */
  // 家族が「連絡先」タブに書いた人を大きなボタンにする。母が自分で押してかける形だけ（自動でつながる仕組みは作らない）
  var callPage = 0;
  function facetimeAddr(s) {
    s = String(s || '').trim();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return s;  // メールアドレス（Apple ID）
    var tel = s.replace(/[\s\-()（）ー－]/g, '');
    return /^\+?\d{6,15}$/.test(tel) ? tel : null;      // 電話番号
  }
  function contacts() {
    return (data['連絡先'] || []).filter(function (o) { return (o['名前'] || '').trim() && facetimeAddr(o['FaceTime']); });
  }
  function renderContacts() {
    var box = $('contacts'); clear(box);
    var rows = contacts(), pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if (callPage >= pages) callPage = pages - 1;
    $('call-pager').hidden = pages <= 1;
    $('call-info').textContent = (callPage + 1) + ' / ' + pages;
    $('call-prev').disabled = callPage === 0;
    $('call-next').disabled = callPage === pages - 1;
    if (!rows.length) { box.appendChild(el('p', 'muted', 'まだ、だれも登録されていません。家族に伝えてください。')); return; }
    rows.slice(callPage * PAGE, callPage * PAGE + PAGE).forEach(function (o) {
      var b = el('button', 'big song', o['名前'].trim());

  }
  function hush() { try { window.speechSynthesis.cancel(); } catch (e) {} }
  // 名前をさわったら、ふつうのテレビ電話か、画面を見てもらう（画面共有）かを選ぶ
  function callTo(o) {
    var name = o['名前'].trim();
    dialog(name + 'に、どうしますか？', [
      { label: 'テレビ電話をかける', cls: 'song', fn: function () { plainCall(o); } },
      { label: '画面を見てもらう', fn: function () { shareCall(o); } },
      { label: 'やめる', fn: closeDialog }
    ]);
  }
  function plainCall(o) {
    var name = o['名前'].trim();
    var text = name + 'に、テレビ電話をかけます。\n「発信」と出たら、「発信」をさわってください。\nおわったら、赤いボタンで切ります。';
    speak(text.replace(/\n/g, ''));
    dialog(text, [
      { label: 'かける', cls: 'song', href: 'facetime://' + facetimeAddr(o['FaceTime']), fn: function () { hush(); setTimeout(closeDialog, 500); } },
      { label: 'やめる', fn: function () { hush(); closeDialog(); } }
    ]);
  }
  // 画面共有：母は共有ボタンを探さなくてよいように、相手（家族）の側から「画面共有を頼む」流れにする。
  // 母が押すのは、FaceTimeに出る「共有」と、操作を頼まれた時の「許可」だけ。かける前に家族にも知らせる
  function shareCall(o) {
    var name = o['名前'].trim();
    // iPadOS 26 の FaceTime では、画面共有は右下の「…」のメニューの中にある（2026-10-04 圭介さんのiPadで確認）
    var text = name + 'に、画面を見てもらいます。\n' +
      'つながったら、右下の「…」をさわって、「画面共有」をさわります。\n' +

    speak(text.replace(/\n/g, ''));
    dialog(text, [
      { label: 'かける', cls: 'song', href: 'facetime://' + facetimeAddr(o['FaceTime']), fn: function () {
        hush();
        if (configured()) api({ kind: 'help', text: 'iPadの画面を見てほしいそうです。' + name + 'にFaceTimeをかけます（母が「…」→「画面共有」を押します）' }).catch(function () {});
        setTimeout(closeDialog, 500);

      { label: 'やめる', fn: function () { hush(); closeDialog(); } }
    ]);
  }
  $('btn-call').addEventListener('click', function () { callPage = 0; renderContacts(); show('call'); });
  $('call-prev').addEventListener('click', function () { if (callPage > 0) { callPage--; renderContacts(); } });
  $('call-next').addEventListener('click', function () { callPage++; renderContacts(); });

  /* ---------- 画面を新しくする ---------- */

  /* ---------- TVerの番組ボタン ---------- */
  // 家族が「番組」タブに書いた番組を大きなボタンにする。さわるとTVerアプリのその番組のページが開く。
  // 番組が1つもなければ、今までどおりTVerボタンでそのままTVerを開く
  var tvPage = 0;
  function programs() {
    return (data['番組'] || []).filter(function (o) {

  function renderPrograms() {

  // ふつうの歌か、カラオケか（歌手の一覧の上で切り替える）。カラオケは「動画○」の列を使わず、検索だけ
  var songMode = 'song';
  function setMode(m) {
    songMode = m;
    $('mode-song').classList.toggle('on', m === 'song');
    $('mode-kara').classList.toggle('on', m === 'karaoke');
    $('mode-song').setAttribute('aria-pressed', String(m === 'song'));
    $('mode-kara').setAttribute('aria-pressed', String(m === 'karaoke'));
  }
  $('mode-song').addEventListener('click', function () { setMode('song'); });
  $('mode-kara').addEventListener('click', function () { setMode('karaoke'); });

  function openSinger(r) {
    var name = r['名前'], mode = songMode, key = mode + ':' + name;
    current = { name: name, key: key, items: [], idx: -1 };
    $('play-title').textContent = name + (mode === 'karaoke' ? '（カラオケ）' : '');
    if (mode === 'song') {
      Object.keys(r).forEach(function (k) {
        if (!/^動画/.test(k.trim())) return;
        var id = videoId(r[k]);
        if (id && !current.items.some(function (x) { return x.id === id; })) current.items.push({ id: id, title: '' });
      });
    }
    if (videoLists[key]) current.items = videoLists[key];
    show('play');
    if (current.items.length) cue(0, false);
    else { renderSongBar(); $('player').appendChild(el('p', 'muted', 'さがしています…')); }
    if (videoLists[key]) return;
    api({ kind: 'videos', name: name, mode: mode }).then(function (res) {
      if (current.key !== key || !res || !res.ok || !res.items || !res.items.length) {
        if (current.key === key && !current.items.length) { clear($('player')); $('player').appendChild(el('p', 'muted', '歌が見つかりませんでした。')); }
        return;
      }
      videoLists[key] = res.items;
      var playingId = current.idx >= 0 ? current.items[current.idx].id : null;
      current.items = res.items;
      // 表の動画が先頭に来るので、ふつうは今出ている曲のまま。曲名と「○/○曲」だけ新しくする
      var keep = playingId ? res.items.map(function (x) { return x.id; }).indexOf(playingId) : -1;
      if (keep >= 0) { current.idx = keep; renderSongBar(); } else cue(0, false);
    }, function () {});
  }
  $('btn-songs').addEventListener('click', function () { show('songs'); });
  $('btn-play-back').addEventListener('click', function () { show('songs'); });
  function bigMode(on) {
    $('v-play').classList.toggle('bigmode', on);
    if (!on) setTimeout(renderSongList, 50);  // 一覧の高さが戻ってから並べ直す
  }
  $('btn-big').addEventListener('click', function () { bigMode(true); });
  $('btn-small').addEventListener('click', function () { bigMode(false); });
  $('btn-prev').addEventListener('click', function () { if (current.idx > 0) cue(current.idx - 1, true); });
  $('btn-next').addEventListener('click', function () { nextSong(true); });

  /* ---------- 困ったボタン ---------- */
  function dialog(text, buttons) {
    $('dlg-text').textContent = text;

    buttons.forEach(function (b) {

      var n = el(b.href ? 'a' : 'button', 'big' + (b.cls ? ' ' + b.cls : ''), b.label);
      if (b.href) { n.href = b.href; if (b.newWin) { n.target = '_blank'; n.rel = 'noopener'; } } else n.type = 'button';

  function closeDialog() { $('dlg').hidden = true; }
  if ($('btn-help')) $('btn-help').addEventListener('click', function () {  // 困ったボタンは外したが、戻す時のために残す

  }

  /* ---------- 設定（タイトルを長押し） ---------- */
  function openSettings(msg) {

  }
  var pressTimer = null;

  function pressEnd() { clearTimeout(pressTimer); }
  title.addEventListener('touchstart', pressStart, { passive: true });
  title.addEventListener('touchend', pressEnd);
  title.addEventListener('touchmove', pressEnd, { passive: true });
  title.addEventListener('touchcancel', pressEnd);
  title.addEventListener('mousedown', pressStart);
  title.addEventListener('mouseup', pressEnd);
  title.addEventListener('mouseleave', pressEnd);
  title.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  $('set-save').addEventListener('click', function () {
    var u = $('set-url').value.trim(), t = $('set-token').value.trim();
    var msg = $('set-msg');
    if (!ENDPOINT_RE.test(u)) { msg.textContent = 'URLが違います。https://script.google.com/macros/s/…/exec の形で入れてください。'; return; }
    if (!t) { msg.textContent = 'あいことばを入れてください。'; return; }
    cfg = { u: u, t: t };
    msg.textContent = 'ためしています…';
    api().then(function (d) {
      if (d.error) { msg.textContent = 'あいことばが合っていません。'; return; }
      writeJSON(KEY_CFG, cfg);
      msg.textContent = 'つながりました。';
      load().then(function () { show('home'); });
    }, function () { msg.textContent = 'つながりませんでした。URLとネットの状態を確かめてください。'; });
  });

  /* ---------- 声で足す（話す→AIが整理→読み返して確認→書き込み） ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  // 「やめる」を押した時：聞き取りを止めて、マイクを手放す
  function stopListen() {
    if (!rec) return;
    var me = rec; rec = null;
    me.onresult = me.onerror = me.onend = null;
    try { me.abort(); } catch (e) {}
  }
  function addByVoice(mode, opt) {
    var cancel = function () { stopListen(); closeDialog(); };
    if (!configured()) { dialog('先に設定が必要です。家族に伝えてください。', [{ label: 'とじる', fn: closeDialog }]); return; }
    if (!SR) { dialog('このiPadでは声が使えません。家族に伝えてください。', [{ label: 'とじる', fn: closeDialog }]); return; }
    var failed = function (msg) {
      dialog(msg, [{ label: 'もう一度', cls: 'song', fn: again }, { label: 'やめる', fn: closeDialog }]);
    };
    var target = opt && opt.target;  // さわった予定を「変える」時は、その行
    var again = function () { addByVoice(mode, opt); };
    var ask = {
      schedule: target ? 'どう変えますか？' : '予定のことを、話してください。',
      singer: 'だれの歌を足しますか？',
      memo: 'メモは何ですか？'
    }[mode];
    var hint = {
      schedule: target
        ? '\n' + describe(target) + '\n（たとえば「4時に変えて」「木曜日にして」）'
        : '\n足す：「あしたの3時に美容院」\n変える：「美容院を4時に変えて」\n消す：「火曜のオレンジルームはやめ」',
      singer: '\n（歌手の名前を言ってください）',
      memo: '\n（話したことを、そのまま残します）'
    }[mode];
    // 聞いてから、読み上げが終わったところで聞き取りを始める（読み上げの声を拾わないように）
    dialog(ask + hint, [{ label: 'やめる', fn: cancel }]);
    speak(ask, function () { if (!$('dlg').hidden) listen(true); });

    // auto：読み上げのあとに自動で始めた時。iPadに断られたら「話す」ボタンを出して、押してから始める
    // 聞き取りが終わったら、マイクをはっきり手放す（そのままだと、iPadの右上のマイクの印が残り続けるため）
    function release(me) {
      if (!me) return;
      me.onresult = me.onerror = me.onend = null;
      try { me.abort(); } catch (e) {}
    }
    function listen(auto) {
      var heard = '';
      var me = rec = new SR();
      rec.lang = 'ja-JP'; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
      // 1回聞き取れたら、すぐに聞き取りを止める
      rec.onresult = function (ev) { heard = ev.results[0][0].transcript; try { me.stop(); } catch (e) {} };
      rec.onerror = function (ev) {
        if (ev.error === 'aborted') return;
        if (rec === me) rec = null;
        release(me);
        if (auto && /not-allowed/.test(ev.error)) { askTap(); return; }
        failed('聞きとれませんでした。');
      };
      rec.onend = function () {
        if (rec !== me) return;
        rec = null;
        release(me);
        if (!heard.trim()) { failed('聞きとれませんでした。'); return; }
        understand(heard);
      };
      // 例（hint）は消さずに出したまま、下に「聞いています」を足す
      dialog(ask + hint + '\n\n🎤 …聞いています', [{ label: 'やめる', fn: cancel }]);
      try { rec.start(); } catch (e) { rec = null; if (auto) askTap(); else failed('声を使えませんでした。'); }
    }
    function askTap() {
      dialog(ask + hint, [{ label: '話す', cls: 'song', fn: function () { listen(false); } }, { label: 'やめる', fn: cancel }]);
    }

    function understand(heard) {
      if (mode === 'memo') {
        confirmAndSend('「' + heard + '」。メモしますか？', { kind: 'addMemo', text: heard }, 'メモしました。', again);
        return;
      }
      dialog('「' + heard + '」…考えています', []);
      api({ kind: 'parse', mode: mode, text: heard, target: target ? target._row : 0 }).then(function (r) {
        if (!r || !r.ok) { failed('うまく分かりませんでした。'); return; }
        if (mode === 'singer') {
          // 6人いっぱいの時は、4人目（入れ替わる枠でいちばん古い人）が外れることを先に伝える
          var singers = (data['歌手'] || []).filter(function (o) { return (o['名前'] || '').trim(); });
          var already = singers.some(function (o) { return o['名前'].trim() === r.name; });
          var out = !already && singers.length >= 6 ? '\n（いちばん古い「' + singers[3]['名前'].trim() + '」は、外れます）' : '';
          confirmAndSend(r.name + '。これでいいですか？' + out, { kind: 'addSinger', name: r.name }, '書きました。', again);
          return;
        }
        var b = r.before, after = whenText(r) + r.content;
        if (r.action === 'delete') {
          confirmAndSend(describe(b) + '。この予定を消します。いいですか？', deleteReq('予定', b), '消しました。', again);
        } else if (r.action === 'update') {
          var sameDay = !r.weekly && !r.repeat && (r.dates || [])[0] && parseDate(r.dates[0]) && parseDate(b['日付']) &&
                        +parseDate(r.dates[0]) === +parseDate(b['日付']) && r.content === b['内容'];
          var q = sameDay
            ? describe(b) + 'の時間を、' + (r.time ? spokenTime(r.time) + 'に' : '時刻なしに') + '変えます。いいですか？'
            : describe(b) + 'を、' + after + 'に変えます。いいですか？';
          confirmAndSend(q,
            { kind: 'updateSchedule', row: b._row, expect: { '日付': b['日付'], '内容': b['内容'] },
              repeat: r.repeat || '', weekly: r.weekly, dates: r.dates, time: r.time, content: r.content, note: r.note }, '変えました。', again);
        } else {
          confirmAndSend(after + '。これでいいですか？',
            { kind: 'addSchedule', dates: r.dates || (r.date ? [r.date] : []), repeat: r.repeat || '', weekly: r.weekly || '', time: r.time, content: r.content, note: r.note }, '書きました。', again);
        }
      }, function () { failed('つながりませんでした。'); });
    }
  }

  // 読み上げて確かめ、「はい」で送る。表が先に変わっていた時は、読み込み直してやり直してもらう
  function confirmAndSend(q, send, doneMsg, again) {
    var failed = function (msg) {
      dialog(msg, [{ label: 'もう一度', cls: 'song', fn: again }, { label: 'やめる', fn: closeDialog }]);
    };
    speak(q);
    var buttons = [
      { label: 'はい', cls: 'song', fn: function () {
        dialog('書いています…', []);
        api(send).then(function (w) {
          if (w && w.changed) { load(); failed('予定の表が変わっていました。もう一度、お願いします。'); return; }
          if (!w || !w.ok) { failed('書けませんでした。'); return; }
          speak(doneMsg);
          dialog(doneMsg, [{ label: 'とじる', fn: closeDialog }]);
          load();
        }, function () { failed('つながりませんでした。'); });
      } }
    ];
    if (again) buttons.push({ label: 'もう一度', fn: again });
    buttons.push({ label: 'やめる', fn: closeDialog });
    dialog(q, buttons);
  }
  function deleteReq(sheet, o) {
    var first = sheet === '予定' ? o['日付'] : o['日時'];
    return { kind: 'deleteRow', sheet: sheet, row: o._row, expect: { first: first, content: o['内容'] } };
  }
  // AIの結果 → 「10月8日（木）と10月9日（金）、3時に、」のような読み上げ用の言葉
  function whenText(r) {
    var when, rule = recurRule(r.repeat || (r.weekly ? '毎週' + r.weekly : ''));
    if (rule) {
      when = recurText(rule) + '、';
    } else {
      when = (r.dates || (r.date ? [r.date] : [])).map(function (s) {
        var m = s.split('/'), dt = new Date(+m[0], +m[1] - 1, +m[2]);
        return (+m[1]) + '月' + (+m[2]) + '日（' + WEEK[dt.getDay()] + '）';
      }).join('と') + '、';
    }
    return when + (r.time ? spokenTime(r.time) + 'に、' : '');
  }
  // 表の1行 → 「10月8日（木）、3時の、プール」「毎週 火曜日の、オレンジルーム」
  function describe(o) {
    var d = o['日付'] || '', when;
    var rule = recurRule(d);
    if (rule) when = recurText(rule);
    else {
      var dt = parseDate(d);
      when = dt ? (dt.getMonth() + 1) + '月' + dt.getDate() + '日（' + WEEK[dt.getDay()] + '）' : d;
    }
    return when + '、' + (o['時刻'] ? spokenTime(o['時刻']) + 'の、' : '') + o['内容'];
  }

  /* ---------- さわって消す・変える ---------- */
  function scheduleMenu(o) {
    dialog(describe(o) + (recurRule(o['日付']) ? '\n（くりかえしの予定。消すと、くりかえし全部が消えます）' : '') + '\nどうしますか？', [
      { label: '変える（話す）', cls: 'song', fn: function () { addByVoice('schedule', { target: o }); } },
      { label: '消す', cls: 'help', fn: function () {
        confirmAndSend(describe(o) + '。この予定を消します。いいですか？', deleteReq('予定', o), '消しました。', null);
      } },
      { label: 'やめる', fn: closeDialog }
    ]);
  }
  function memoMenu(o) {
    dialog('「' + o['内容'] + '」\nこのメモを、どうしますか？', [
      { label: '読む', cls: 'song', fn: function () { speak(o['内容']); } },
      { label: '消す', cls: 'help', fn: function () {
        confirmAndSend('このメモを消します。いいですか？', deleteReq('メモ', o), '消しました。', null);
      } },
      { label: 'とじる', fn: closeDialog }
    ]);
  }
  function renderMemos() {
    // 新しいメモから順に。入りきらない分は「▲ 上へ／下へ ▼」で見られる
    var memos = (data['メモ'] || []).filter(function (o) { return (o['内容'] || '').trim(); }).slice().reverse();
    var rows = memos.map(function (o) {
      return { kind: 'item', group: -1, make: function () {
        var m = (o['日時'] || '').match(/(\d{1,2})\D+(\d{1,2})\D+(\d{1,2}:\d{2})/);
        return tapItem(m ? (+m[1]) + '/' + (+m[2]) + ' ' + m[3] : '', el('div', 'what', o['内容']), function () { memoMenu(o); });
      } };
    });
    if (!rows.length) rows.push({ kind: 'note', group: -1, make: function () { return el('p', 'muted', 'メモは、ありません。'); } });
    pagedList('memos', rows);
  }

  $('btn-add-sched').addEventListener('click', function () { addByVoice('schedule'); });
  $('btn-add-singer').addEventListener('click', function () { addByVoice('singer'); });
  $('btn-memo').addEventListener('click', function () { addByVoice('memo'); });

  /* ---------- 起動 ---------- */
  // メモの欄の高さが決まってから、残りの高さで予定を並べる
  function renderAll() {
    renderMemos(); renderSchedule(); renderSingers();
    if (!$('v-regular').hidden) renderRegular();
    // 並べた直後は周りの高さがまだ落ち着いていないことがあるので、次の描画でもう一度並べ直す
    requestAnimationFrame(function () { setTimeout(function () { renderMemos(); renderSchedule(); }, 50); });
  }
  // 向きを変えた時は、入りきる数が変わるので並べ直す
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      renderAll();
      if (current.idx >= 0) listPage = Math.floor(current.idx / perPage());
      renderSongList();
    }, 200);
  });

  (function importHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    var u = null, t = null;
    h.split('&').forEach(function (p) {
      var i = p.indexOf('='); if (i < 0) return;
      var k = p.slice(0, i), v = decodeURIComponent(p.slice(i + 1));
      if (k === 'u') u = v;
      if (k === 't') t = v;
    });
    if (u && t && ENDPOINT_RE.test(u)) { cfg = { u: u, t: t }; writeJSON(KEY_CFG, cfg); }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  })();

  /* ---------- 画面の大きさを変えない ---------- */
  // iPadのSafariは user-scalable=no を無視することがあるので、指で広げる操作とダブルタップもここで止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastTap = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTap < 350) e.preventDefault();  // 2回目のすばやいタップは拡大に使わせない（ボタンの2度押しも防げる）
    lastTap = now;
  }, { passive: false });

  tick();
  setInterval(tick, 20000);
  var cached = readJSON(KEY_CACHE);
  if (cached && cached.data) { data = cached.data; renderAll(); }
  load();
  setInterval(load, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { tick(); checkUpdate(); if (configured()) load(); }
  });

  /* ---------- 新しい版があれば読み込み直す（再生中・ダイアログ表示中は待つ） ---------- */
  function checkUpdate() {
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
      v = v.trim();
      if (!v || v === VERSION) return;
      if (!homeIdle()) return;
      try { if (localStorage.getItem('otasuke.reload') === v) return; localStorage.setItem('otasuke.reload', v); } catch (e) { return; }
      location.replace(location.pathname + '?v=' + encodeURIComponent(v));
    }).catch(function () {});
  }
  // 読み込み直してよいのは、ホーム画面でダイアログも出ていない時だけ（歌や番組を選んでいる途中で急に変わらないように）
  function homeIdle() { return !$('v-home').hidden && $('dlg').hidden; }
  checkUpdate();
  setInterval(checkUpdate, 5 * 60 * 1000);

  // 毎日、夜中（2〜5時）に1回読み直す。開きっぱなしでも、毎朝いちばん新しい版になるように
  var openedAt = Date.now();
  setInterval(function () {
    var h = new Date().getHours();
    if (h >= 2 && h < 5 && Date.now() - openedAt > 6 * 3600 * 1000 && homeIdle()) freshReload();
  }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
